<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Brick by Brick</title>
<meta name="theme-color" content="#070b16" />
<meta name="description" content="An isometric tower builder. Drop bricks, keep the tower wide. Built for Global Hack Week: Builders Week." />
<style>
  :root{
    --bg:#070b16;
    --cyan:#5ee7ff;
    --amber:#ffc94d;
    --ink:#e8f1ff;
    --dim:rgba(232,241,255,.45);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,system-ui,"Helvetica Neue",sans-serif;
    overflow:hidden;
    touch-action:none;
    overscroll-behavior:none;
    user-select:none;
    -webkit-user-select:none;
    -webkit-font-smoothing:antialiased;
  }
  #game{ position:fixed; inset:0; width:100%; height:100%; display:block; }

  /* ---------- HUD ---------- */
  .hud{
    position:fixed; top:0; left:0; right:0;
    display:flex; align-items:flex-start; justify-content:space-between;
    padding:calc(env(safe-area-inset-top, 0px) + 18px) 20px 0 20px;
    pointer-events:none;
    z-index:5;
  }
  .hud-block{ display:flex; flex-direction:column; gap:2px; }
  .hud-block.right{ align-items:flex-end; }
  .label{
    font-size:9px; letter-spacing:.26em; font-weight:700;
    color:var(--dim); text-transform:uppercase;
  }
  .value{
    font-size:34px; font-weight:800; line-height:1;
    letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;
    text-shadow:0 0 24px rgba(94,231,255,.28);
  }
  .value.small{ font-size:17px; font-weight:700; color:var(--dim); text-shadow:none; }

  .combo{
    position:fixed; left:50%; top:23%;
    transform:translate(-50%,0);
    font-size:13px; font-weight:800; letter-spacing:.16em;
    color:var(--amber);
    text-transform:uppercase;
    opacity:0;
    pointer-events:none;
    z-index:6;
    text-shadow:0 0 22px rgba(255,201,77,.55);
    white-space:nowrap;
  }
  @keyframes pop{
    0%   { opacity:0; transform:translate(-50%,10px) scale(.86); }
    18%  { opacity:1; transform:translate(-50%,0) scale(1.04); }
    70%  { opacity:1; transform:translate(-50%,-14px) scale(1); }
    100% { opacity:0; transform:translate(-50%,-30px) scale(.98); }
  }

  /* ---------- Overlay ---------- */
  .overlay{
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    padding:28px;
    pointer-events:none;
    background:radial-gradient(115% 85% at 50% 38%, rgba(7,11,22,.5), rgba(7,11,22,.93) 78%);
    opacity:1;
    transition:opacity .3s ease, visibility .3s ease;
  }
  .overlay.hide{ opacity:0; visibility:hidden; }

  .card{
    width:100%; max-width:330px;
    text-align:center;
    transform:translateY(-4vh);
  }
  .tag{
    font-size:10px; font-weight:800; letter-spacing:.24em;
    color:var(--cyan); opacity:.9;
    margin-bottom:16px;
  }
  .tag span{ color:var(--dim); }
  h1{
    margin:0 0 16px;
    font-size:clamp(34px, 11.5vw, 48px);
    line-height:.92;
    font-weight:800;
    letter-spacing:-.035em;
    text-transform:uppercase;
  }
  h1 .thin{ color:var(--cyan); }
  p.sub{
    margin:0 0 26px;
    font-size:12.5px; line-height:1.65;
    color:var(--dim);
    letter-spacing:.01em;
  }
  p.sub b{ color:var(--ink); font-weight:600; }
  .btn{
    display:inline-block;
    padding:14px 28px;
    border:0; border-radius:999px;
    background:var(--amber);
    color:#0a0e18;
    font-family:inherit;
    font-size:11.5px; font-weight:800; letter-spacing:.16em;
    text-transform:uppercase;
    box-shadow:0 10px 34px rgba(255,201,77,.22);
  }
  .hint{
    margin-top:18px;
    font-size:10px; letter-spacing:.14em;
    color:rgba(232,241,255,.28);
    text-transform:uppercase;
  }
  .stat-row{
    display:flex; justify-content:center; gap:34px;
    margin:0 0 24px;
  }
  .stat{ display:flex; flex-direction:column; gap:4px; }
  .stat .n{ font-size:26px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .stat .k{ font-size:9px; letter-spacing:.2em; color:var(--dim); text-transform:uppercase; font-weight:700; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="hud-block">
    <div class="label">Score</div>
    <div class="value" id="score">0</div>
  </div>
  <div class="hud-block right">
    <div class="label">Best</div>
    <div class="value small" id="best">0</div>
  </div>
</div>

<div class="combo" id="combo"></div>

<div class="overlay" id="overlay">
  <div class="card">
    <div class="tag" id="ov-tag">GHW <span>·</span> BUILDERS WEEK</div>
    <h1 id="ov-title">BRICK<br><span class="thin">BY BRICK</span></h1>
    <p class="sub" id="ov-sub">Time the drop. Land it clean and the tower keeps its full width. Land it sloppy and the overhang shears off.</p>
    <div id="ov-stats"></div>
    <div class="btn" id="ov-btn">Start building</div>
    <div class="hint" id="ov-hint">tap anywhere</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var cvs = document.getElementById('game');
  var ctx = cvs.getContext('2d');

  var elScore   = document.getElementById('score');
  var elBest    = document.getElementById('best');
  var elCombo   = document.getElementById('combo');
  var elOverlay = document.getElementById('overlay');
  var elTag     = document.getElementById('ov-tag');
  var elTitle   = document.getElementById('ov-title');
  var elSub     = document.getElementById('ov-sub');
  var elStats   = document.getElementById('ov-stats');
  var elBtn     = document.getElementById('ov-btn');
  var elHint    = document.getElementById('ov-hint');

  // ------------------------------------------------------------------ tuning
  var BASE_THICK = 30;      // brick thickness in world units
  var ISO        = 0.46;    // iso rhombus half-height / half-width
  var START_HW   = 105;     // starting half-width of a brick
  var PERFECT_T  = 7;       // world-unit tolerance for a perfect drop
  var GRAVITY    = 2100;    // screen px / s^2 for debris

  var W = 0, H = 0, DPR = 1, U = 1;

  var G = {
    mode: 'ready',          // ready | play | over
    blocks: [],
    mv: { x: 0, dir: 1, hw: START_HW, hidden: false },
    speed: 230,
    score: 0,
    combo: 0,
    perfects: 0,
    best: 0,
    cam: 0,
    shake: 0,
    frags: [],
    parts: [],
    clock: 0,
    lock: 0
  };

  try { G.best = parseInt(localStorage.getItem('bbb_best') || '0', 10) || 0; } catch (e) { G.best = 0; }

  // ------------------------------------------------------------------ layout
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cvs.clientWidth;
    H = cvs.clientHeight;
    cvs.width  = Math.round(W * DPR);
    cvs.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    U = Math.max(0.74, Math.min(1.25, W / 430));
  }

  var stars = [];
  function seedStars() {
    stars = [];
    for (var i = 0; i < 76; i++) {
      stars.push({
        x: Math.random(),
        y: Math.random(),
        r: Math.random() * 1.3 + 0.35,
        a: Math.random() * 0.32 + 0.06,
        s: Math.random() * 0.7 + 0.25
      });
    }
  }

  // ------------------------------------------------------------------ helpers
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function hueFor(i) { return (188 + i * 12) % 360; }
  function thickPx() { return BASE_THICK * U; }
  function levelY(i) { return H * 0.70 - i * thickPx() + G.cam * U; }
  function levelX(x) { return W / 2 + x * U; }
  function swingRange() { return (W * 0.36) / U; }

  function hsla(h, s, l, a) { return 'hsla(' + h + ',' + s + '%,' + l + '%,' + a + ')'; }
  function hsl(h, s, l) { return 'hsl(' + h + ',' + s + '%,' + l + '%)'; }

  // ------------------------------------------------------------------ audio
  var actx = null;
  function audio() {
    if (!actx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { actx = new AC(); } catch (e) { return null; }
    }
    if (actx.state === 'suspended') { actx.resume(); }
    return actx;
  }
  function blip(freq, dur, type, vol, slideTo) {
    var a = audio();
    if (!a) return;
    var t = a.currentTime;
    var o = a.createOscillator();
    var g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.07, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(a.destination);
    o.start(t);
    o.stop(t + dur + 0.03);
  }

  // ------------------------------------------------------------------ drawing
  function drawBackground() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#070b16');
    g.addColorStop(0.5, '#0a1020');
    g.addColorStop(1, '#05080f');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var cx = W / 2, cy = H * 0.60;
    var rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.62);
    rg.addColorStop(0, 'rgba(94,231,255,0.11)');
    rg.addColorStop(0.42, 'rgba(94,231,255,0.035)');
    rg.addColorStop(1, 'rgba(94,231,255,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);

    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var yy = (s.y * H + G.cam * U * 0.22 * s.s) % H;
      if (yy < 0) yy += H;
      ctx.globalAlpha = s.a;
      ctx.fillStyle = '#9fd8ff';
      ctx.fillRect(s.x * W, yy, s.r, s.r);
    }
    ctx.globalAlpha = 1;
  }

  function drawBrick(sx, sy, hwWorld, hue, alpha) {
    var hw = hwWorld * U;
    if (hw < 0.9) return;
    var hh = hw * ISO;
    var th = thickPx();
    var a = (alpha == null) ? 1 : alpha;

    ctx.globalAlpha = a;

    // left face
    var gl = ctx.createLinearGradient(0, sy, 0, sy + th);
    gl.addColorStop(0, hsl(hue, 55, 42));
    gl.addColorStop(1, hsl(hue, 60, 23));
    ctx.beginPath();
    ctx.moveTo(sx - hw, sy);
    ctx.lineTo(sx, sy + hh);
    ctx.lineTo(sx, sy + hh + th);
    ctx.lineTo(sx - hw, sy + th);
    ctx.closePath();
    ctx.fillStyle = gl;
    ctx.fill();

    // right face
    var gr = ctx.createLinearGradient(0, sy, 0, sy + th);
    gr.addColorStop(0, hsl(hue, 62, 56));
    gr.addColorStop(1, hsl(hue, 66, 34));
    ctx.beginPath();
    ctx.moveTo(sx + hw, sy);
    ctx.lineTo(sx, sy + hh);
    ctx.lineTo(sx, sy + hh + th);
    ctx.lineTo(sx + hw, sy + th);
    ctx.closePath();
    ctx.fillStyle = gr;
    ctx.fill();

    // top face
    ctx.beginPath();
    ctx.moveTo(sx, sy - hh);
    ctx.lineTo(sx + hw, sy);
    ctx.lineTo(sx, sy + hh);
    ctx.lineTo(sx - hw, sy);
    ctx.closePath();
    ctx.fillStyle = hsl(hue, 70, 65);
    ctx.fill();

    // stray edge lines so a lone brick still reads as a solid slab
    ctx.beginPath();
    ctx.moveTo(sx - hw, sy);
    ctx.lineTo(sx, sy + hh);
    ctx.lineTo(sx + hw, sy);
    ctx.strokeStyle = 'rgba(2,5,12,0.28)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    // studs
    if (hw > 16) {
      var rx = hw * 0.19;
      var ry = rx * ISO;
      var offs = hw * 0.46;
      ctx.fillStyle = hsl(hue, 62, 74);
      for (var k = -1; k <= 1; k++) {
        ctx.beginPath();
        ctx.ellipse(sx + k * offs, sy, rx, ry, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = a * 0.5;
      ctx.fillStyle = hsl(hue, 58, 52);
      for (var m = -1; m <= 1; m++) {
        ctx.beginPath();
        ctx.ellipse(sx + m * offs, sy + ry * 0.55, rx * 0.92, ry * 0.8, 0, 0, Math.PI);
        ctx.fill();
      }
      ctx.globalAlpha = a;
    }

    // top edge highlight
    ctx.beginPath();
    ctx.moveTo(sx - hw, sy);
    ctx.lineTo(sx, sy - hh);
    ctx.lineTo(sx + hw, sy);
    ctx.strokeStyle = hsla(hue, 100, 88, 0.5 * a);
    ctx.lineWidth = 1.1;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(sx - hw, sy);
    ctx.lineTo(sx - hw, sy + th);
    ctx.strokeStyle = hsla(hue, 90, 70, 0.22 * a);
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.globalAlpha = 1;
  }

  function drawCrane(sx, sy, hw) {
    var top = -20;
    var cy = sy - hw * ISO * U;
    var lg = ctx.createLinearGradient(0, top, 0, cy);
    lg.addColorStop(0, 'rgba(94,231,255,0)');
    lg.addColorStop(0.6, 'rgba(94,231,255,0.20)');
    lg.addColorStop(1, 'rgba(94,231,255,0.55)');
    ctx.strokeStyle = lg;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(sx, top);
    ctx.lineTo(sx, cy);
    ctx.stroke();

    // clamp
    ctx.fillStyle = 'rgba(94,231,255,0.85)';
    ctx.fillRect(sx - 9, cy - 7, 18, 5);
  }

  function drawGroundShadow() {
    var y = levelY(0) + thickPx() + 6;
    var w = 190 * U;
    var g = ctx.createRadialGradient(W / 2, y, 0, W / 2, y, w);
    g.addColorStop(0, 'rgba(94,231,255,0.16)');
    g.addColorStop(0.55, 'rgba(94,231,255,0.05)');
    g.addColorStop(1, 'rgba(94,231,255,0)');
    ctx.save();
    ctx.translate(W / 2, y);
    ctx.scale(1, 0.28);
    ctx.beginPath();
    ctx.arc(0, 0, w, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();
  }

  // ------------------------------------------------------------------ particles
  function burst(x, y, hue, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 70 + Math.random() * 150;
      G.parts.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 110,
        life: 0.34 + Math.random() * 0.32,
        max: 0.66,
        s: 2 + Math.random() * 2.6,
        hue: hue + (Math.random() * 46 - 23)
      });
    }
  }

  // ------------------------------------------------------------------ game flow
  function reset() {
    G.blocks = [{ x: 0, hw: START_HW, anim: 0 }];
    G.mv.x = 0;
    G.mv.dir = Math.random() < 0.5 ? 1 : -1;
    G.mv.hw = START_HW;
    G.mv.hidden = false;
    G.speed = 230;
    G.score = 0;
    G.combo = 0;
    G.perfects = 0;
    G.cam = 0;
    G.shake = 0;
    G.frags.length = 0;
    G.parts.length = 0;
    G.clock = 0;
    syncHud();
  }

  function syncHud() {
    elScore.textContent = String(G.score);
    elBest.textContent = String(G.best);
  }

  var overlayToken = 0;
  function hideOverlay() {
    var token = ++overlayToken;
    elOverlay.classList.add('hide');
    window.setTimeout(function () {
      if (token === overlayToken) elOverlay.style.display = 'none';
    }, 320);
  }
  function showOverlay() {
    var token = ++overlayToken;
    elOverlay.style.display = 'flex';
    void elOverlay.offsetWidth;
    if (token === overlayToken) elOverlay.classList.remove('hide');
  }

  function startGame() {
    reset();
    restoreIntro();
    G.mode = 'play';
    G.lock = performance.now() + 180;
    hideOverlay();
    blip(420, 0.10, 'triangle', 0.05, 620);
  }

  function restoreIntro() {
    elTag.innerHTML = 'GHW <span>&middot;</span> BUILDERS WEEK';
    elTitle.innerHTML = 'BRICK<br><span class="thin">BY BRICK</span>';
    elSub.textContent = 'Time the drop. Land it clean and the tower keeps its full width. Land it sloppy and the overhang shears off.';
    elStats.innerHTML = '';
    elBtn.textContent = 'Start building';
    elHint.textContent = 'tap anywhere';
  }

  function gameOver() {
    G.mode = 'over';
    G.lock = performance.now() + 420;
    G.shake = 1;
    blip(190, 0.42, 'sawtooth', 0.055, 62);

    if (G.score > G.best) {
      G.best = G.score;
      try { localStorage.setItem('bbb_best', String(G.best)); } catch (e) {}
    }
    syncHud();

    window.setTimeout(function () {
      if (G.mode !== 'over') return;
      elTag.innerHTML = 'TOWER DOWN';
      elTitle.innerHTML = 'NICE<br><span class="thin">STACK</span>';
      elSub.textContent = 'Every level you lose comes off the sides. Keep it centred and it never shrinks.';
      elStats.innerHTML =
        '<div class="stat-row">' +
          '<div class="stat"><div class="n">' + G.score + '</div><div class="k">Score</div></div>' +
          '<div class="stat"><div class="n">' + G.blocks.length + '</div><div class="k">Bricks</div></div>' +
          '<div class="stat"><div class="n">' + G.perfects + '</div><div class="k">Perfect</div></div>' +
        '</div>';
      elBtn.textContent = 'Build again';
      elHint.textContent = 'tap anywhere';
      showOverlay();
    }, 620);
  }

  function drop() {
    if (G.mode !== 'play' || G.mv.hidden) return;

    var base = G.blocks[G.blocks.length - 1];
    var m = G.mv;
    var mL = m.x - m.hw, mR = m.x + m.hw;
    var bL = base.x - base.hw, bR = base.x + base.hw;
    var oL = Math.max(mL, bL);
    var oR = Math.min(mR, bR);
    var overlap = oR - oL;

    // total miss
    if (overlap <= 6) {
      G.frags.push({
        level: G.blocks.length,
        x: m.x, yOff: 0,
        hw: m.hw,
        hue: hueFor(G.blocks.length),
        vx: (m.x > base.x ? 1 : -1) * (150 + Math.random() * 120),
        vy: -180,
        rot: 0,
        vr: (m.x > base.x ? 1 : -1) * 3.2,
        a: 1
      });
      G.mv.hidden = true;
      gameOver();
      return;
    }

    var perfect = Math.abs(m.x - base.x) < PERFECT_T;
    var newHW = perfect ? m.hw : overlap / 2;
    var newX  = perfect ? base.x : (oL + oR) / 2;
    var hue   = hueFor(G.blocks.length);

    // shear fragments
    if (!perfect) {
      if (m.x > base.x) {
        var wR = (m.x + m.hw) - oR;
        if (wR > 2.5) {
          G.frags.push({
            level: G.blocks.length, x: oR + wR / 2, yOff: 0, hw: wR / 2, hue: hue,
            vx: 150 + Math.random() * 90, vy: -160, rot: 0, vr: 2.8, a: 1
          });
        }
      } else {
        var wL = oL - (m.x - m.hw);
        if (wL > 2.5) {
          G.frags.push({
            level: G.blocks.length, x: oL - wL / 2, yOff: 0, hw: wL / 2, hue: hue,
            vx: -(150 + Math.random() * 90), vy: -160, rot: 0, vr: -2.8, a: 1
          });
        }
      }
    }

    G.blocks.push({ x: newX, hw: newHW, anim: 1 });

    if (perfect) {
      G.combo++;
      G.perfects++;
      G.score += 10 + G.combo * 5;
      burst(levelX(newX), levelY(G.blocks.length - 1), hue, 16);
      showCombo('PERFECT ×' + G.combo);
      blip(520 + Math.min(G.combo, 8) * 55, 0.11, 'triangle', 0.06, 780);
      G.shake = 0.35;
    } else {
      if (G.combo > 0) showCombo('STREAK LOST');
      G.combo = 0;
      G.score += 10;
      blip(300, 0.07, 'square', 0.045, 240);
    }

    // next brick: same width as the one just placed
    G.mv.hw = newHW;
    G.mv.x = clamp(G.mv.x, -swingRange(), swingRange());
    G.mv.dir = Math.random() < 0.5 ? 1 : -1;
    G.mv.hidden = true;
    G.speed = Math.min(620, 210 + G.blocks.length * 12);

    syncHud();

    // respawn shortly after the drop-in settles
    window.setTimeout(function () {
      if (G.mode === 'play') G.mv.hidden = false;
    }, 110);
  }

  var comboTimer = null;
  function showCombo(text) {
    elCombo.textContent = text;
    elCombo.style.animation = 'none';
    void elCombo.offsetWidth;
    elCombo.style.animation = 'pop .78s ease-out forwards';
    if (comboTimer) window.clearTimeout(comboTimer);
    comboTimer = window.setTimeout(function () {
      elCombo.style.animation = 'none';
      elCombo.style.opacity = '0';
    }, 820);
  }

  // ------------------------------------------------------------------ update
  function update(dt) {
    G.clock += dt;

    // camera eases toward the top of the stack
    var targetCam = Math.max(0, (G.blocks.length - 1) * BASE_THICK);
    var k = 1 - Math.exp(-9 * dt);
    G.cam += (targetCam - G.cam) * k;
    if (targetCam - G.cam > BASE_THICK * 2) G.cam = targetCam - BASE_THICK * 2;

    if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 2.4);

    // swing
    if (!G.mv.hidden && (G.mode === 'play' || G.mode === 'ready')) {
      var R = swingRange();
      G.mv.x += G.mv.dir * G.speed * dt;
      if (G.mv.x >= R) { G.mv.x = R; G.mv.dir = -1; }
      if (G.mv.x <= -R) { G.mv.x = -R; G.mv.dir = 1; }
    }

    // brick drop-in animation
    for (var i = 0; i < G.blocks.length; i++) {
      if (G.blocks[i].anim > 0) G.blocks[i].anim = Math.max(0, G.blocks[i].anim - dt * 7.5);
    }

    // debris
    for (var f = G.frags.length - 1; f >= 0; f--) {
      var fr = G.frags[f];
      fr.vy += GRAVITY * dt;
      fr.x += fr.vx * dt;
      fr.yOff += fr.vy * dt;
      fr.rot += fr.vr * dt;
      fr.a -= dt * 0.42;
      if (fr.a <= 0 || fr.yOff > H * 1.6) G.frags.splice(f, 1);
    }

    // sparks
    for (var p = G.parts.length - 1; p >= 0; p--) {
      var pt = G.parts[p];
      pt.vy += 780 * dt;
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.life -= dt;
      if (pt.life <= 0) G.parts.splice(p, 1);
    }
  }

  // ------------------------------------------------------------------ render
  function render() {
    ctx.save();

    if (G.shake > 0.01) {
      var s = G.shake * 5;
      ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    }

    drawBackground();
    drawGroundShadow();

    // tower
    for (var i = 0; i < G.blocks.length; i++) {
      var b = G.blocks[i];
      var lift = b.anim > 0 ? -150 * U * b.anim : 0;
      drawBrick(levelX(b.x), levelY(i) + lift, b.hw, hueFor(i), 1);
    }

    // level seams — drawn last so the brick above can't swallow them
    for (var si = 0; si < G.blocks.length; si++) {
      var sb = G.blocks[si];
      var sy2 = levelY(si) + (sb.anim > 0 ? -150 * U * sb.anim : 0);
      var scx = levelX(sb.x);
      var shw = sb.hw * U;
      var shh = shw * ISO;
      if (shw < 3) continue;
      ctx.beginPath();
      ctx.moveTo(scx - shw, sy2);
      ctx.lineTo(scx, sy2 + shh);
      ctx.lineTo(scx + shw, sy2);
      ctx.strokeStyle = 'rgba(2,5,12,0.42)';
      ctx.lineWidth = 1.8;
      ctx.stroke();
    }

    // sheared pieces
    for (var f = 0; f < G.frags.length; f++) {
      var fr = G.frags[f];
      var fy = levelY(fr.level) + fr.yOff;
      ctx.save();
      ctx.translate(levelX(fr.x), fy);
      ctx.rotate(fr.rot);
      ctx.translate(-levelX(fr.x), -fy);
      drawBrick(levelX(fr.x), fy, fr.hw, fr.hue, Math.max(0, fr.a));
      ctx.restore();
    }

    // incoming brick + crane
    if (!G.mv.hidden) {
      var idx = G.blocks.length;
      var my = levelY(idx);
      var mx = levelX(G.mv.x);
      if (G.mode === 'play') drawCrane(mx, my, G.mv.hw);
      drawBrick(mx, my, G.mv.hw, hueFor(idx), 1);
    }

    // sparks
    for (var p = 0; p < G.parts.length; p++) {
      var pt = G.parts[p];
      ctx.globalAlpha = Math.max(0, pt.life / pt.max);
      ctx.fillStyle = hsl(pt.hue, 92, 70);
      ctx.fillRect(pt.x - pt.s / 2, pt.y - pt.s / 2, pt.s, pt.s);
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  // ------------------------------------------------------------------ loop
  var last = 0;
  function frame(now) {
    if (!last) last = now;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    window.requestAnimationFrame(frame);
  }

  // ------------------------------------------------------------------ input
  function tap() {
    var now = performance.now();
    if (now < G.lock) return;
    if (G.mode === 'ready' || G.mode === 'over') {
      startGame();
    } else {
      drop();
    }
  }

  window.addEventListener('pointerdown', function (e) {
    if (e.button && e.button !== 0) return;
    tap();
  }, { passive: true });

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowDown') {
      e.preventDefault();
      tap();
    }
  });

  window.addEventListener('resize', function () {
    resize();
    seedStars();
  });

  window.addEventListener('orientationchange', function () {
    window.setTimeout(function () { resize(); seedStars(); }, 220);
  });

  // ------------------------------------------------------------------ boot
  resize();
  seedStars();
  reset();
  syncHud();
  window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
